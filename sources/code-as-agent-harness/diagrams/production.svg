<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Paper-derived production interpretation"><rect width="820" height="300" rx="18" fill="#f6f4ee"/><g font-family="Inter,system-ui"><text x="40" y="42" font-size="16" font-weight="700">Paper-derived production interpretation</text><text x="40" y="66" font-size="12" fill="#66736f">The event and receipt envelopes are our implementation choices, not claims of paper authorship.</text><g transform="translate(45 105)"><rect width="210" height="100" rx="12" fill="#fff" stroke="#177e76" stroke-width="2"/><text x="105" y="42" text-anchor="middle" font-weight="700">Durable state</text><text x="105" y="66" text-anchor="middle" font-size="12">artifacts + checkpoints</text></g><g transform="translate(305 105)"><rect width="210" height="100" rx="12" fill="#17312c"/><text x="105" y="42" text-anchor="middle" font-weight="700" fill="#fff">Executable harness</text><text x="105" y="66" text-anchor="middle" font-size="12" fill="#fff">plans + operations</text></g><g transform="translate(565 105)"><rect width="210" height="100" rx="12" fill="#fff" stroke="#177e76" stroke-width="2"/><text x="105" y="42" text-anchor="middle" font-weight="700">Independent checks</text><text x="105" y="66" text-anchor="middle" font-size="12">tests + receipts</text></g></g></svg>
