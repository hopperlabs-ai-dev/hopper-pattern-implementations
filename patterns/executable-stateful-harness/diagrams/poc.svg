<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc"><title id="title">Executable harness POC</title><desc id="desc">A task flows through a typed plan, executable steps, verifier, and receipt.</desc><style>text{font-family:Inter,system-ui,sans-serif;fill:#17312c}.box{fill:#fff;stroke:#177e76;stroke-width:2}.accent{fill:#dff1ed}.arrow{stroke:#177e76;stroke-width:3;marker-end:url(#a)}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#60716b}</style><defs><marker id="a" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0 0l8 4-8 4z" fill="#177e76"/></marker></defs><rect width="900" height="280" rx="18" fill="#f6f4ee"/><g transform="translate(40 88)"><rect class="box" width="140" height="90" rx="12"/><text class="label" x="70" y="39" text-anchor="middle">Task</text><text class="small" x="70" y="62" text-anchor="middle">typed input</text></g><path class="arrow" d="M180 133h55"/><g transform="translate(235 88)"><rect class="box accent" width="150" height="90" rx="12"/><text class="label" x="75" y="39" text-anchor="middle">Plan</text><text class="small" x="75" y="62" text-anchor="middle">bounded steps</text></g><path class="arrow" d="M385 133h55"/><g transform="translate(440 88)"><rect class="box" width="150" height="90" rx="12"/><text class="label" x="75" y="39" text-anchor="middle">Execute</text><text class="small" x="75" y="62" text-anchor="middle">state + events</text></g><path class="arrow" d="M590 133h55"/><g transform="translate(645 88)"><rect class="box accent" width="170" height="90" rx="12"/><text class="label" x="85" y="39" text-anchor="middle">Verify</text><text class="small" x="85" y="62" text-anchor="middle">receipt or recovery</text></g></svg>
