<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Production executable harness</title><desc id="desc">An authorized agent uses typed operations while an event store, checkpoint authority, verifier, and receipt ledger retain independent state.</desc><style>text{font-family:Inter,system-ui,sans-serif;fill:#17312c}.box{fill:#fff;stroke:#177e76;stroke-width:2}.dark{fill:#17312c}.darktext{fill:#fff}.arrow{stroke:#177e76;stroke-width:2.5;marker-end:url(#a)}.dash{stroke:#8a9a94;stroke-width:2;stroke-dasharray:7 6}.label{font-size:16px;font-weight:700}.small{font-size:12px;fill:#60716b}</style><defs><marker id="a" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0 0l8 4-8 4z" fill="#177e76"/></marker></defs><rect width="900" height="430" rx="18" fill="#f6f4ee"/><g transform="translate(55 45)"><rect class="box" width="180" height="76" rx="12"/><text class="label" x="90" y="33" text-anchor="middle">Agent</text><text class="small" x="90" y="54" text-anchor="middle">proposes typed plan</text></g><path class="arrow" d="M235 83h90"/><g transform="translate(325 45)"><rect class="dark" width="250" height="76" rx="12"/><text class="label darktext" x="125" y="32" text-anchor="middle">Harness runtime</text><text class="small darktext" x="125" y="54" text-anchor="middle">authorize · bound · execute</text></g><path class="arrow" d="M575 83h90"/><g transform="translate(665 45)"><rect class="box" width="180" height="76" rx="12"/><text class="label" x="90" y="33" text-anchor="middle">Tool boundary</text><text class="small" x="90" y="54" text-anchor="middle">admitted operations</text></g><g transform="translate(55 220)"><rect class="box" width="180" height="76" rx="12"/><text class="label" x="90" y="33" text-anchor="middle">Event store</text><text class="small" x="90" y="54" text-anchor="middle">append before publish</text></g><g transform="translate(270 220)"><rect class="box" width="180" height="76" rx="12"/><text class="label" x="90" y="33" text-anchor="middle">Checkpoints</text><text class="small" x="90" y="54" text-anchor="middle">resume + replay</text></g><g transform="translate(485 220)"><rect class="box" width="180" height="76" rx="12"/><text class="label" x="90" y="33" text-anchor="middle">Verifier</text><text class="small" x="90" y="54" text-anchor="middle">independent assertions</text></g><g transform="translate(700 220)"><rect class="box" width="145" height="76" rx="12"/><text class="label" x="72" y="33" text-anchor="middle">Receipts</text><text class="small" x="72" y="54" text-anchor="middle">content addressed</text></g><path class="dash" d="M450 121v55H145v44M450 176h-90v44M450 176h125v44M450 176h322v44"/><text class="small" x="55" y="375">Production adapters replace the in-memory stores without changing the plan, event, checkpoint, verification, or receipt contracts.</text></svg>
